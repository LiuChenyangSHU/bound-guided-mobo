[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-mobo-framework"
version = "0.1.0"
description = "A minimal simulator-agnostic multi-objective Bayesian optimization workflow."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2", "torch>=2.2,<3", "botorch>=0.17,<0.18"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
simulation-mobo = "simulation_mobo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
