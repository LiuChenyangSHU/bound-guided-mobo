[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bound-guided-mobo"
version = "0.1.2"
description = "Bound-informed design spaces, Bayesian recommendation, and feedback-driven search-window policies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2", "torch>=2.2,<3", "botorch>=0.17,<0.18"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
bound-guided-mobo = "simulation_mobo.cli:main"
simulation-mobo = "simulation_mobo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
